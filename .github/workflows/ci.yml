name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m py_compile ahaos/*.py scripts/pilot.py
      - run: pytest
      - run: ahaos validate --memory-dir examples/coding_agent_pr_review
      - run: ahaos run --memory-dir examples/coding_agent_pr_review --report-dir /tmp/ahaos-reports --top-k 3
      - run: python scripts/pilot.py --input-dir examples/local_pilot_input --work-dir /tmp/ahaos-local-pilot --report-dir /tmp/ahaos-local-pilot-reports --top-k 3
      - run: python scripts/pilot.py --input-dir examples/local_pilot_input --work-dir /tmp/ahaos-local-pilot --report-dir /tmp/ahaos-local-pilot-reports --top-k 3 --dry-run
